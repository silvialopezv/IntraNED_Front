<div class="modal-header" style="background-color: #052d6c; color: white;">
    <h3 class="modal-title">Menu EEASA</h3>
    <button type="button" style="background-color: white;" class="btn-close btn-light" aria-label="Close"
        (click)="activeModal.close('Close click')"></button>
</div>
<div class="modal-body">
    <form #procesoForm="ngForm" class="row g-3">
        <!-- Codigo -->
        <div class="form-group row mt3 mt-3">
            <label for="procesoCod" class="col-form-label col-sm-4 col-form-label-sm">Código: </label>
            <div class="col-sm-8">
                <input type="text" class="form-control form-control-sm" [(ngModel)]="rMenu.IMMEN_CODIGO"
                    name="menuCodigo" #menuCodigo=ngModel>
            </div>
        </div>
        <!-- Nombre -->
        <div class="form-group row mt3 mt-3 mt-3">
            <label for="observacion" class="col-form-label col-sm-4 col-form-label-sm">Nombre: </label>
            <div class="col-sm-8">
                <textarea style="resize: none;" name="nombre" class="form-control form-control-sm" rows="2"
                    [(ngModel)]="rMenu.IMMEN_NOMBRE"></textarea>
            </div>
        </div>
        <!-- Activo -->
        <div class="form-group row mt3 mt-3">
            <label class="col-form-label col-sm-4 col-form-label-sm" for="estado">Activo: </label>
            <div class="col-sm-8">
                <select id="activo" class="form-select form-select-sm" name="estado"
                    [(ngModel)]="rMenu.IMMEN_ESTADO">
                    <option value="1">
                        SI
                    </option>
                    <option value="0">
                        NO
                    </option>
                </select>
            </div>
        </div>
    </form>
    <!-- Alerta -->
    <div id="myAlert2" class="alert alert-warning mt-3" role="alert" style="display: none;">
        <h4 class="alert-heading">Campo vacío</h4>
        <hr>
        <p id="message"></p>
    </div>
    <!-- Barra de progreso -->
    <div id="progress" style="display: none;">
        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:100%"></div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button role="button" class="btn" style="background-color: #052d6c;color: #fff;"
        *ngIf="!actualizar" (click)="validarCampos()">Guardar</button>
    <button role="button" class="btn" style="background-color: #052d6c;color: #fff;" 
        *ngIf="actualizar" (click)="validarCamposActualizar()">Actualizar</button>
    <button type="button" class="btn" style="background-color: #AD1212;color: #fff;"
        (click)="activeModal.close('Close click')">Cancelar</button>
</div>
